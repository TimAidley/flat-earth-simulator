<!-- Added to the home screen on iOS this launches chromeless, which is the
     only route to a full-screen view there: iPhone Safari has no Fullscreen
     API for ordinary elements. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Bay Trail Horizon</title>
<style>
  :root {
    color-scheme: dark;
    --panel: #16191eee;
    --edge: #333a44;
    --text: #e6e9ee;
    --dim: #9aa4b2;
    --accent: #6fb2ff;
    --warn: #f0a860;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: #0b0d10;
    -webkit-text-size-adjust: 100%;
  }

  /* --- stage: camera and render, side by side or overlaid --------------- */
  #stage { position: fixed; inset: 0; display: flex; flex-direction: row; }
  #cam, #view { flex: 1 1 0; min-width: 0; min-height: 0; display: block; }
  #cam { object-fit: cover; background: #000; display: none; }
  #view { width: 100%; height: 100%; touch-action: none; }

  body.mode-split #stage { flex-direction: row; }
  body.mode-split #cam { display: block; }
  @media (orientation: portrait) {
    body.mode-split #stage { flex-direction: column; }
  }

  body.mode-blend #cam {
    display: block;
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  body.mode-blend #view { position: absolute; inset: 0; }

  /* Seam between the two halves, so the boundary is unmistakable. */
  body.mode-split #view { border-left: 1px solid var(--edge); }
  @media (orientation: portrait) {
    body.mode-split #view { border-left: 0; border-top: 1px solid var(--edge); }
  }

  /* --- panels ----------------------------------------------------------- */
  .panel {
    position: fixed;
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 12px 14px;
  }

  #controls {
    top: 52px; left: 10px; width: 272px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    transition: transform .18s ease, opacity .18s ease;
  }
  body.tucked #controls {
    transform: translateX(calc(-100% - 14px));
    opacity: 0;
    pointer-events: none;
  }

  #readout {
    top: 52px; right: 10px; max-width: 290px; line-height: 1.65;
    transition: opacity .18s ease;
  }
  body.tucked #readout { opacity: 0; pointer-events: none; }

  /* One always-visible bar, so the panels can go away completely. */
  #bar {
    position: fixed; top: 10px; left: 10px; right: 10px;
    display: flex; gap: 8px; align-items: center;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 6px 8px;
  }
  #bar .grow { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }

  #provenance {
    bottom: 10px; left: 10px; right: 10px;
    color: var(--dim); font-size: 12px; text-align: center;
  }
  body.tucked #provenance { display: none; }

  label { display: block; margin: 10px 0 3px; color: var(--dim); font-size: 12px; }
  select, input[type="range"], input[type="datetime-local"] { width: 100%; }
  select, input[type="datetime-local"] {
    background: #0e1116; color: var(--text);
    border: 1px solid var(--edge); border-radius: 6px; padding: 5px 7px;
    font: inherit;
  }
  button {
    padding: 7px 10px;
    background: #1d2430; border: 1px solid var(--edge); border-radius: 6px;
    color: var(--text); cursor: pointer; font: inherit; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #controls button { width: 100%; margin-top: 10px; }
  .value { color: var(--accent); font-variant-numeric: tabular-nums; }

  .toggle { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  .toggle label { margin: 0; }

  #model-badge {
    display: none; margin-top: 10px; padding: 5px 8px; border-radius: 6px;
    background: #4a2a12; border: 1px solid #7a4a1e; font-size: 12px;
  }
  body.is-flat #model-badge { display: block; }

  #cam-note {
    margin-top: 8px; font-size: 12px; color: var(--warn);
    display: none;
  }
  #cam-note.show { display: block; }

  @media (prefers-reduced-motion: reduce) {
    #controls, #readout { transition: none; }
  }
</style>

<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="view"></canvas>
</div>

<div id="bar">
  <button id="tuck" aria-pressed="false" title="Hide the panels">&#9776;</button>
  <button id="camera" aria-pressed="false">Camera</button>
  <button id="mode">Split</button>
  <button id="full" aria-pressed="false" title="Full screen">&#9974;</button>
  <span class="grow" id="bar-status"></span>
</div>

<div id="controls" class="panel">
  <label for="observer">Observer</label>
  <select id="observer"></select>

  <label for="target">Target</label>
  <select id="target"></select>
  <button id="aim">Aim at target</button>

  <div class="toggle">
    <input type="checkbox" id="flat" />
    <label for="flat">Flat Earth</label>
  </div>
  <div id="model-badge">Flat model: curvature disabled</div>

  <label for="when">Time (for tide)</label>
  <input type="datetime-local" id="when" />

  <label for="focal">Focal length <span id="focal-value" class="value"></span> mm (35 mm eq.)</label>
  <input type="range" id="focal" min="16" max="1200" step="2" value="300" />

  <label for="k">Refraction k <span id="k-value" class="value"></span></label>
  <input type="range" id="k" min="-0.2" max="1.2" step="0.01" value="0.13" />

  <label for="eye">Eye height <span id="eye-value" class="value"></span> m</label>
  <input type="range" id="eye" min="0.5" max="20" step="0.1" value="1.6" />

  <label for="visibility">Visibility <span id="visibility-value" class="value"></span> km</label>
  <input type="range" id="visibility" min="5" max="200" step="1" value="60" />

  <label for="blend">Render opacity <span id="blend-value" class="value"></span>% (blend mode)</label>
  <input type="range" id="blend" min="0" max="100" step="1" value="50" />

  <div id="cam-note"></div>
</div>

<div id="readout" class="panel"></div>
<div id="provenance" class="panel"></div>

<script type="module" src="./main.ts"></script>
