<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Flat Earth Simulator</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: #16191ecc;
        --edge: #333a44;
        --text: #e6e9ee;
        --dim: #9aa4b2;
        --accent: #6fb2ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: #0b0d10;
      }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

      .panel {
        position: fixed;
        background: var(--panel);
        backdrop-filter: blur(8px);
        border: 1px solid var(--edge);
        border-radius: 10px;
        padding: 12px 14px;
      }
      #controls { top: 12px; left: 12px; width: 268px; }
      #readout  { top: 12px; right: 12px; max-width: 300px; line-height: 1.7; }
      #provenance {
        bottom: 12px; left: 12px; right: 12px;
        color: var(--dim); font-size: 12px; text-align: center;
      }

      label { display: block; margin: 10px 0 3px; color: var(--dim); font-size: 12px; }
      select, input[type="range"] { width: 100%; }
      select {
        background: #0e1116; color: var(--text);
        border: 1px solid var(--edge); border-radius: 6px; padding: 5px 7px;
      }
      button {
        width: 100%; margin-top: 10px; padding: 7px;
        background: #1d2430; border: 1px solid var(--edge); border-radius: 6px;
        color: var(--text); cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      .value { color: var(--accent); font-variant-numeric: tabular-nums; }

      .toggle { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
      .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
      body.is-flat #model-badge { display: block; }
      #model-badge {
        display: none; margin-top: 10px; padding: 5px 8px; border-radius: 6px;
        background: #4a2a12; border: 1px solid #7a4a1e; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="controls" class="panel">
      <label for="observer">Observer</label>
      <select id="observer"></select>

      <label for="target">Target</label>
      <select id="target"></select>
      <button id="aim">Aim at target</button>

      <div class="toggle">
        <input type="checkbox" id="flat" />
        <label for="flat" style="margin: 0">Flat Earth</label>
      </div>
      <div id="model-badge">Flat model: curvature disabled</div>

      <label for="focal">Focal length <span id="focal-value" class="value"></span> mm (35 mm eq.)</label>
      <input type="range" id="focal" min="16" max="1200" step="2" value="300" />

      <label for="k">Refraction k <span id="k-value" class="value"></span></label>
      <input type="range" id="k" min="-0.2" max="1.2" step="0.01" value="0.13" />

      <label for="eye">Eye height <span id="eye-value" class="value"></span> m</label>
      <input type="range" id="eye" min="0.5" max="20" step="0.1" value="1.6" />

      <label for="visibility">Visibility <span id="visibility-value" class="value"></span> km</label>
      <input type="range" id="visibility" min="5" max="200" step="1" value="60" />
    </div>

    <div id="readout" class="panel"></div>
    <div id="provenance" class="panel"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
