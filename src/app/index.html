<link rel="icon" href="data:," />
<!-- Without this a phone lays the page out at about 980 CSS pixels and scales
     the result to fit, so a CSS pixel stops being a device pixel by an
     arbitrary factor. That breaks the one thing this page is for: the
     arcminutes-per-pixel figure becomes fiction and the render is drawn at a
     fraction of the screen's real resolution. viewport-fit=cover lets the
     picture run under a notch, with the panels held clear of it below. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Added to the home screen on iOS this launches chromeless, which is the
     only route to a full-screen view there: iPhone Safari has no Fullscreen
     API for ordinary elements. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Bay Trail Horizon</title>
<style>
  :root {
    color-scheme: dark;
    --panel: #16191eee;
    --edge: #333a44;
    --text: #e6e9ee;
    --dim: #9aa4b2;
    --accent: #6fb2ff;
    --warn: #f0a860;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: #0b0d10;
    -webkit-text-size-adjust: 100%;
  }

  /* --- stage: camera and render, side by side or overlaid ---------------
     The stage owns the gestures, not the canvas: a pinch that starts over
     the camera half is still a pinch, and during calibration the tap that
     matters lands on the video. */
  #stage { position: fixed; inset: 0; display: flex; flex-direction: row; touch-action: none; }
  #cam-wrap, #view { flex: 1 1 0; min-width: 0; min-height: 0; }
  /* The wrapper is what clips: the video itself is magnified past its own
     bounds to match the render's field of view, and the overflow has to go
     somewhere other than over the render. */
  #cam-wrap { display: none; position: relative; overflow: hidden; background: #000; }
  #cam {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform-origin: 50% 50%;
  }
  #view { display: block; width: 100%; height: 100%; }

  body.mode-split #stage { flex-direction: row; }
  body.mode-split #cam-wrap { display: block; }
  @media (orientation: portrait) {
    body.mode-split #stage { flex-direction: column; }
  }

  body.mode-blend #cam-wrap { display: block; position: absolute; inset: 0; }
  body.mode-blend #view { position: absolute; inset: 0; }

  /* Seam between the two halves, so the boundary is unmistakable. */
  body.mode-split #view { border-left: 1px solid var(--edge); }
  @media (orientation: portrait) {
    body.mode-split #view { border-left: 0; border-top: 1px solid var(--edge); }
  }

  /* --- panels ----------------------------------------------------------- */
  .panel {
    position: fixed;
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 12px 14px;
  }

  /* Held clear of the notch and the home indicator. The picture runs under
     them; the controls must not, or the rounded corner eats a button. */
  #controls {
    top: calc(52px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    width: 272px;
    max-height: calc(100vh - 130px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow-y: auto;
    transition: transform .18s ease, opacity .18s ease;
  }
  body.tucked #controls {
    transform: translateX(calc(-100% - 14px));
    opacity: 0;
    pointer-events: none;
  }

  #readout {
    top: calc(52px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    max-width: 290px; line-height: 1.65;
    transition: opacity .18s ease;
  }
  body.tucked #readout { opacity: 0; pointer-events: none; }

  /* One always-visible bar, so the panels can go away completely. */
  #bar {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    right: calc(10px + env(safe-area-inset-right));
    display: flex; gap: 6px; align-items: center;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 6px 8px;
  }
  #bar .grow { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  #bar button { padding: 7px 9px; }

  #provenance {
    bottom: calc(10px + env(safe-area-inset-bottom));
    left: calc(10px + env(safe-area-inset-left));
    right: calc(10px + env(safe-area-inset-right));
    color: var(--dim); font-size: 12px; text-align: center;
  }
  body.tucked #provenance { display: none; }

  /* Calibration takes over the bottom of the screen, and stays visible while
     tucked: the whole point of it is tapping the picture. */
  #calibrate {
    bottom: calc(10px + env(safe-area-inset-bottom));
    left: calc(10px + env(safe-area-inset-left));
    right: calc(10px + env(safe-area-inset-right));
    display: none; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  body.calibrating #calibrate { display: flex; }
  body.calibrating #provenance { display: none; }
  #calibrate .step { flex: 1 1 180px; min-width: 0; }
  #calibrate select { width: auto; flex: 1 1 140px; }

  label { display: block; margin: 10px 0 3px; color: var(--dim); font-size: 12px; }
  select, input[type="range"], input[type="datetime-local"] { width: 100%; }
  select, input[type="datetime-local"] {
    background: #0e1116; color: var(--text);
    border: 1px solid var(--edge); border-radius: 6px; padding: 5px 7px;
    font: inherit;
  }
  button {
    padding: 7px 10px;
    background: #1d2430; border: 1px solid var(--edge); border-radius: 6px;
    color: var(--text); cursor: pointer; font: inherit; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #controls button { width: 100%; margin-top: 10px; }
  #calibrate button { width: auto; margin: 0; }
  .value { color: var(--accent); font-variant-numeric: tabular-nums; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 4px; }

  .toggle { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  .toggle label { margin: 0; }

  .group {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--edge);
  }
  .group > h2 {
    margin: 0; font-size: 12px; font-weight: 600; color: var(--dim);
    text-transform: uppercase; letter-spacing: .06em;
  }

  #model-badge {
    display: none; margin-top: 10px; padding: 5px 8px; border-radius: 6px;
    background: #4a2a12; border: 1px solid #7a4a1e; font-size: 12px;
  }
  body.is-flat #model-badge { display: block; }

  #cam-note {
    margin-top: 10px; font-size: 12px; color: var(--warn);
    display: none;
  }
  #cam-note.show { display: block; }

  @media (prefers-reduced-motion: reduce) {
    #controls, #readout { transition: none; }
  }
</style>

<div id="stage">
  <div id="cam-wrap"><video id="cam" playsinline muted autoplay></video></div>
  <canvas id="view"></canvas>
</div>

<div id="bar">
  <button id="tuck" aria-pressed="false" title="Hide the panels">&#9776;</button>
  <button id="camera" aria-pressed="false">Camera</button>
  <button id="mode">Split</button>
  <button id="gps" aria-pressed="false" title="Stand where I am">&#9678;</button>
  <button id="gyro" aria-pressed="false" title="Follow the phone's orientation">&#8635;</button>
  <button id="full" aria-pressed="false" title="Full screen">&#9974;</button>
  <span class="grow" id="bar-status"></span>
</div>

<div id="controls" class="panel">
  <label for="observer">Observer</label>
  <select id="observer"></select>

  <label for="target">Target</label>
  <select id="target"></select>
  <button id="aim">Aim at target</button>

  <div class="toggle">
    <input type="checkbox" id="flat" />
    <label for="flat">Flat Earth</label>
  </div>
  <div id="model-badge">Flat model: curvature disabled</div>

  <label for="when">Time (for tide)</label>
  <input type="datetime-local" id="when" />

  <label for="focal">Focal length <span id="focal-value" class="value"></span> mm (35 mm eq.)</label>
  <!-- Step of one, not two: the minimum moves to whatever the attached lens
       can actually match, and a coarser step would make round numbers like
       300 mm unreachable from an odd lower bound. -->
  <input type="range" id="focal" min="16" max="1200" step="1" value="300" />

  <label for="k">Refraction k <span id="k-value" class="value"></span></label>
  <input type="range" id="k" min="-0.2" max="1.2" step="0.01" value="0.13" />

  <label for="eye">Eye height <span id="eye-value" class="value"></span> m</label>
  <input type="range" id="eye" min="0.5" max="20" step="0.1" value="1.6" />

  <label for="visibility">Visibility <span id="visibility-value" class="value"></span> km</label>
  <input type="range" id="visibility" min="5" max="200" step="1" value="60" />

  <label for="blend">Render opacity <span id="blend-value" class="value"></span>% (blend mode)</label>
  <input type="range" id="blend" min="0" max="100" step="1" value="50" />

  <div class="group">
    <h2>Camera</h2>
    <label for="lens">Lens</label>
    <select id="lens" disabled></select>
    <div class="hint" id="lens-hint">Turn the camera on to list the lenses.</div>

    <label for="camfov">Camera field of view <span id="camfov-value" class="value"></span>&deg;</label>
    <input type="range" id="camfov" min="4" max="120" step="0.1" value="62" />
    <div class="hint" id="camfov-hint"></div>
    <button id="calibrate-start" disabled>Calibrate on two landmarks</button>
  </div>

  <div class="group">
    <h2>Orientation</h2>
    <div class="hint" id="gyro-hint">
      The compass is good to a few degrees; a long lens is narrower than that.
      Drag to align once, then let the phone track.
    </div>
    <button id="gyro-reset" hidden>Re-align gyro to this view</button>
  </div>

  <div id="cam-note"></div>
</div>

<div id="readout" class="panel"></div>
<div id="provenance" class="panel"></div>

<div id="calibrate" class="panel">
  <span class="step" id="calibrate-step"></span>
  <select id="cal-target"></select>
  <button id="cal-cancel">Cancel</button>
</div>

<script type="module" src="./main.ts"></script>
