name: Pages

# Deploys on merge to the default branch, or on demand.
#
# Deliberately not on every push. Publishing needs two repo settings that a
# workflow token cannot grant itself — Actions must have read and write
# permissions, and Pages must be sourced from GitHub Actions — so until those
# are set this job fails, and on a per-push trigger it marks every pull request
# red for a reason that has nothing to do with the code. The github-pages
# environment also commonly restricts deployments to the default branch, which
# is the second reason a feature-branch trigger is the wrong default.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; cancel superseded runs rather than queueing them.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Restore terrain tile cache
        uses: actions/cache@v4
        with:
          path: .cache/tiles
          key: terrain-tiles-${{ hashFiles('scenes/*.json') }}
          restore-keys: terrain-tiles-

      # The scene bundle is generated, not committed. A runner has the network
      # access to build it — Overture, NOAA and the terrain tiles are all
      # reachable here — so the deployed site carries a full bundle without
      # several megabytes of generated data living in git.
      - name: Build scene
        timeout-minutes: 25
        run: npm run build:scene -- scenes/bay-area.json --strict

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      # Vite copies bundles/ into dist/, so the scene ships with the app.
      - name: Build app
        run: npm run build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
