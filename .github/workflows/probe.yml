name: Probe Overture

# On demand only. Inspecting the source data needs DuckDB's extensions, which
# are unreachable from some development sandboxes, so this exists to run the
# query somewhere with ordinary network access and print the answer.
on:
  workflow_dispatch:
    inputs:
      theme:
        description: Overture theme
        default: base
      type:
        description: Overture type
        default: infrastructure
      bbox:
        description: minLon,minLat,maxLon,maxLat
        default: '-122.49,37.80,-122.46,37.84'
      where:
        description: extra SQL predicate
        default: ''
      columns:
        description: extra SELECT columns
        default: "subtype, class, names.primary AS name"
      limit:
        description: max rows
        default: '80'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Query
        run: |
          npm run probe -- \
            --theme '${{ inputs.theme }}' \
            --type '${{ inputs.type }}' \
            --bbox '${{ inputs.bbox }}' \
            --columns '${{ inputs.columns }}' \
            --limit '${{ inputs.limit }}' \
            ${{ inputs.where && format('--where ''{0}''', inputs.where) || '' }} \
            | tee probe.log
          { echo '```'; cat probe.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
